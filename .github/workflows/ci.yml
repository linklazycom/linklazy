name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Strict: these must pass.
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Lint is strict since Batch 20: 0 errors required (27 "set state in effect"
      # warnings are known and allowed, see eslint.config.mjs).
      - name: Lint
        run: npm run lint

      # Build is not strict yet: it has never been seen green in CI. After one
      # green run shows up in the Actions tab, delete the continue-on-error line.
      - name: Build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com
